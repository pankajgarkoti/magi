# ranger: EVA desktop (stow package ~/dotfiles/ranger). Only overrides; ranger's defaults load first.
set colorscheme eva
set show_hidden false
# zh toggles hidden files (ranger default); also on Backspace/Ctrl+H
map <backspace> toggle_option show_hidden
map <C-h> toggle_option show_hidden
set preview_files true
set preview_directories true
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true
# Alacritty can't show images (no sixel/kitty/ueberzug here): text previews only
set preview_images false
set draw_borders both
set dirname_in_tabs true
set line_numbers false
set sort natural
set sort_directories_first true
set confirm_on_delete multiple
set mouse_enabled true
set update_title true
set tilde_in_titlebar true
set vcs_aware true
set column_ratios 1,3,4
# devicons: auto-enabled only if the ranger_devicons plugin is cloned into
# ~/.config/ranger/plugins/ranger_devicons (not installed now; Nerd Font is)
