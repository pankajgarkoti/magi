# Fallback for GTK 3 apps that don't read gsettings (X11/XWayland without dbus).
# On Wayland the live values come from gsettings, set by eva-theme.
[Settings]
gtk-theme-name=EVA
gtk-icon-theme-name=EVA
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=IosevkaTerm Nerd Font Mono 10
gtk-application-prefer-dark-theme=1
