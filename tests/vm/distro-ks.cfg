# TEST ONLY: unattended install of the MAGI ISO in the test VM. Same install source as the
# shipped distro/iso/magi.ks; adds a disk layout, a test user with passwordless sudo, sshd,
# GDM autologin, and an insecure local registry (the host's, 10.0.2.2:5000) for the
# bootc upgrade / rollback test.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --hostname=magi-distro
rootpw --lock
user --name=pilot --groups=wheel --password=magi --plaintext
zerombr
clearpart --all --initlabel
autopart --type=btrfs
firstboot --disable
xconfig --startxonboot
services --enabled=sshd
poweroff
ostreecontainer --url=/run/install/repo/magi --transport=oci --no-signature-verification

%post --erroronfail
bootc switch --mutate-in-place --transport registry @IMAGE_REF@
mkdir -p /etc/containers/registries.conf.d
cat > /etc/containers/registries.conf.d/50-magi-test.conf <<'REG'
[[registry]]
location = "10.0.2.2:5000"
insecure = true
REG
echo 'pilot ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/pilot
chmod 440 /etc/sudoers.d/pilot
cat > /etc/gdm/custom.conf <<'GDM'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=pilot
GDM
%end
