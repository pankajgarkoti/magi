# MAGI test VM: unattended Fedora 44 Workstation install
text
url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --hostname=magi-test
rootpw --lock
user --name=pilot --groups=wheel --password=magi --plaintext
zerombr
clearpart --all --initlabel
autopart --type=btrfs
bootloader --location=mbr
firstboot --disable
xconfig --startxonboot
services --enabled=sshd
poweroff
%packages
@^workstation-product-environment
openssh-server
%end
%post
echo 'pilot ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/pilot
chmod 440 /etc/sudoers.d/pilot
%end
